<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5658a6">

  <title>PHYSIOPHARM LABORATOIRES – Dr Hassan Bella</title>

  <link rel="icon" href="img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --brand: #5658a6;
      --deep: #2d2f72;
      --mid: #7b7dc4;
      --soft: #e9ebfa;
      --bg: #f6f7fe;
      --ink: #23244f;
      --muted: #62648f;
      --white: #fff;
      --font: 'Sora', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, #dfe2f8 0, transparent 45%),
        radial-gradient(circle at 90% 85%, #d3d6f3 0, transparent 45%),
        var(--bg);
      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom);
      overflow-x: hidden;
      position: relative;
    }

    /* Decorations */

    #decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    #decor svg {
      position: absolute;
      fill: none;
      stroke: var(--brand);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .16;
      animation: float var(--d, 9s) ease-in-out infinite;
      animation-delay: var(--l, 0s);
    }

    #decor svg.f {
      fill: var(--brand);
      stroke: none;
      opacity: .07;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) rotate(var(--r, 0deg));
      }

      50% {
        transform:
          translateY(-22px)
          rotate(calc(var(--r, 0deg) + 14deg));
      }
    }

    /* Language switch */

    .lang {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 2px;
      padding: 4px;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(45, 47, 114, .15);
    }

    .lang button {
      border: 0;
      background: none;
      font: 600 12px var(--font);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
    }

    .lang button[aria-pressed="true"] {
      background: var(--brand);
      color: #fff;
    }

    .lang button:focus-visible,
    .link:focus-visible {
      outline: 3px solid var(--deep);
      outline-offset: 2px;
    }

    /* Layout */

    main {
      position: relative;
      z-index: 1;
      max-width: 460px;
      margin: 0 auto;
      padding: 64px 18px 28px;
      text-align: center;
    }

    /* Logo */

    .logo-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
    }

    .logo {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 34px rgba(86, 88, 166, .3);
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .logo img {
      width: 96%;
      height: auto;
      display: block;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed var(--mid);
      animation: spin 28s linear infinite;
    }

    .ring.r2 {
      inset: 14px;
      border: 1.5px solid rgba(86, 88, 166, .25);
      animation: spin 18s linear infinite reverse;
    }

    .orbit {
      position: absolute;
      inset: 0;
      animation: spin var(--s, 8s) linear infinite;
    }

    .orbit i {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 4px rgba(86, 88, 166, .2);
    }

    .orbit.o2 {
      inset: 14px;
      --s: 12s;
      animation-direction: reverse;
    }

    .orbit.o2 i {
      width: 10px;
      height: 10px;
      margin-left: -5px;
      top: -4px;
      background: var(--mid);
    }

    .pulse {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 2px solid var(--brand);
      opacity: 0;
      animation: pulse 3.2s ease-out infinite;
    }

    .pulse.p2 {
      animation-delay: 1.6s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(.8);
        opacity: .5;
      }

      100% {
        transform: scale(1.25);
        opacity: 0;
      }
    }

    /* Identity */

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--deep);
      letter-spacing: .01em;
    }

    .dr {
      margin-top: 6px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--brand);
    }

    .desc {
      margin: 16px auto 22px;
      max-width: 36ch;
      font-size: .92rem;
      line-height: 1.65;
      color: var(--muted);
    }

    /* Links */

    .links {
      display: grid;
      gap: 11px;
      text-align: start;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(86, 88, 166, .14);
      border-radius: 18px;
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(45, 47, 114, .08);
      transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
      opacity: 0;
      transform: translateY(14px);
      animation:
        in .6s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(.35s + var(--i) * .08s);
    }

    a.link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(86, 88, 166, .22);
      background: #fff;
    }

    a.link:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(86, 88, 166, .14);
      background: rgba(255, 255, 255, .92);
    }

    a.link.main:hover,
    a.link.main:active {
      background: var(--brand);
    }

    .ic {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--brand);
      display: grid;
      place-items: center;
    }

    .ic svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .link.main {
      background: var(--brand);
      color: #fff;
      border-color: transparent;
    }

    .link.main .ic {
      background: rgba(255, 255, 255, .2);
    }

    .link.main small {
      color: #e3e4fa;
    }

    .txt {
      min-width: 0;
      flex: 1;
    }

    .txt b {
      display: block;
      font-size: .95rem;
      font-weight: 600;
    }

    .txt small {
      display: block;
      margin-top: 2px;
      font-size: .8rem;
      color: var(--muted);
      overflow-wrap: anywhere;
      direction: ltr;
      text-align: start;
    }

    .txt small.addr {
      direction: inherit;
    }

    .chev {
      flex: none;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--mid);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .link.main .chev {
      stroke: #fff;
    }

    @keyframes in {
      to {
        opacity: 1;
        transform: none;
      }
    }

    footer {
      margin-top: 26px;
      font-size: .75rem;
      color: var(--muted);
    }

    footer svg {
      width: 60px;
      height: 14px;
      fill: none;
      stroke: var(--mid);
      stroke-width: 2;
      display: block;
      margin: 0 auto 8px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }

      .link {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

  <script>
    /* Translations */

    const T = {
      fr: {
        dr: "Dr Hassan Bella",
        role: "Pharmacien",
        desc: "Le laboratoire PHYSIOPHARM développe et fabrique des produits dermo-cosmétiques, des soins corporels, des produits d’hygiène et des compléments alimentaires, alliant expertise scientifique, qualité et bien-être.",

        fixe: "Téléphone fixe",
        mail1: "E-mail du Dr Bella",
        mail2: "E-mail du laboratoire",
        addr: "Adresse",
        addrv: "N° 60, Zone Industrielle Sidi Bibi, Agadir, Maroc"
      },

      en: {
        dr: "Dr Hassan Bella",
        role: "Pharmacist",
        desc: "PHYSIOPHARM laboratory develops and manufactures dermo-cosmetic products, body care products, hygiene products, and dietary supplements, combining scientific expertise, quality, and well-being.",
        call: "Call",
        fixe: "Landline",
        mail1: "Dr Bella's email",
        mail2: "Laboratory email",
        addr: "Address",
        addrv: "No. 60, Sidi Bibi Industrial Zone, Agadir, Morocco"
      }
    };

    function setLang(lang) {
      if (!T[lang]) {
        lang = "fr";
      }

      document.documentElement.lang = lang;
      document.documentElement.dir = "ltr";

      document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {
          element.textContent =
            T[lang][element.dataset.i18n];
        });

      document
        .querySelectorAll(".lang button")
        .forEach(button => {
          button.setAttribute(
            "aria-pressed",
            button.dataset.lang === lang
          );
        });

      try {
        localStorage.setItem("pp-lang", lang);
      } catch (error) {}
    }

    document
      .querySelectorAll(".lang button")
      .forEach(button => {
        button.onclick = () =>
          setLang(button.dataset.lang);
      });

    let saved = "fr";

    try {
      saved =
        localStorage.getItem("pp-lang") || "fr";
    } catch (error) {}

    if (!T[saved]) {
      saved = "fr";
    }

    setLang(saved);

    /* Pharmacy background decorations */

    const syms = [
      "capsule",
      "pill",
      "cross",
      "drop",
      "mol",
      "mortar",
      "syringe",
      "beat",
      "leaf",
      "capsule-f",
      "cross",
      "pill"
    ];

    const spots = [
      [4, 6],
      [78, 4],
      [40, 12],
      [92, 22],
      [10, 26],
      [60, 30],
      [85, 42],
      [3, 48],
      [48, 52],
      [24, 64],
      [72, 66],
      [92, 80],
      [8, 84],
      [44, 90],
      [64, 92],
      [30, 38],
      [18, 10],
      [56, 76]
    ];

    const decor =
      document.getElementById("decor");

    spots.forEach((position, index) => {
      const symbol =
        syms[index % syms.length];

      const size =
        34 + (index * 17) % 38;

      const element =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );

      element.setAttribute(
        "viewBox",
        "0 0 48 48"
      );

      element.innerHTML =
        '<use href="#' +
        symbol +
        '"/>';

      if (
        symbol === "capsule-f" ||
        index % 7 === 0
      ) {
        element.classList.add("f");
      }

      element.style.cssText =
        "left:" +
        position[0] +
        "%;" +
        "top:" +
        position[1] +
        "%;" +
        "width:" +
        size +
        "px;" +
        "height:" +
        size +
        "px;" +
        "--r:" +
        ((index * 37) % 70 - 35) +
        "deg;" +
        "--d:" +
        (7 + (index % 5) * 1.6) +
        "s;" +
        "--l:-" +
        index * 0.9 +
        "s";

      decor.appendChild(element);
    });
  </script>
